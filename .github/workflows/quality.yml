name: SDK quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: rust-sdk-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4d407b29186a635f0cc27475ef0bc0ae605a8866 # 1.86.0
        with:
          toolchain: 1.86.0
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
      - name: Validate instance lock in the supported runtime image
        run: ./scripts/test_instance_lock_container.sh
      - name: Validate blank operator-evidence intake
        run: python3 scripts/check_systemd_operator_validation.py
      - name: Validate isolated systemd watchdog recovery
        run: |
          sudo env "PATH=$PATH" \
            "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" \
            "RUSTUP_HOME=$(rustup show home)" \
            IICP_SYSTEMD_EVIDENCE_SCOPE=system \
            ./scripts/validate_systemd_watchdog.sh \
            "$RUNNER_TEMP/systemd-watchdog-evidence.json"
          cat "$RUNNER_TEMP/systemd-watchdog-evidence.json"
