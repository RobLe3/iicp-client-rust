name: Publish release

# Manual-only while the guarded local publisher remains authoritative.
# Enabling release:published before the CI lane is validated would create
# two competing publishers for the same immutable version.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing release version without the v prefix
        required: true
        type: string

concurrency:
  group: rust-release-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: crates-io
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/../.iicp-ci-target/rust-sdk-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.event.release.tag_name }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4d407b29186a635f0cc27475ef0bc0ae605a8866 # 1.86.0
        with:
          toolchain: 1.86.0
          components: rustfmt, clippy
      - name: Install pinned security scanner
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Verify, test and package
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ inputs.version || github.event.release.tag_name }}"
          expected="${expected#v}"
          actual=$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)
          test "$actual" = "$expected"
          python3 scripts/check_dependency_policy.py
          cargo audit
          cargo fmt --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features
          cargo package --locked
      - name: Clean-install smoke
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          version="${version#v}"
          crate="$CARGO_TARGET_DIR/package/iicp-client-${version}.crate"
          test -f "$crate"
          tar -tzf "$crate" | grep -Eq '/Cargo.lock$'
          mkdir -p /tmp/iicp-release-source /tmp/iicp-release-smoke
          tar -xzf "$crate" -C /tmp/iicp-release-source
          package=$(find /tmp/iicp-release-source -mindepth 1 -maxdepth 1 -type d -print -quit)
          cargo install --locked --path "$package" --features nat --root /tmp/iicp-release-smoke
          /tmp/iicp-release-smoke/bin/iicp-node --version
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish
